<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page extend under the notch and home
         indicator; the layout pays that back with env(safe-area-inset-*)
         padding. maximum-scale stops iOS zooming the whole UI when a text
         field takes focus, which in a full-screen game looks like a bug. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="I&rsquo;mBoredToday" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fredoka and Inter are bundled via @fontsource and imported once in
         src/main.jsx, so they are part of the build rather than a request to
         Google on every launch. Importing them there rather than in a screen
         component matters for the same reason the CDN link lived here: a
         <style> inside a component only exists while that component is
         mounted, so the font would vanish on navigation. -->
    <title>imBoredToday | Free Daily Puzzle &amp; Brain Games</title>
    <meta name="description" content="Play six free daily puzzle and brain games on imBoredToday. Solve Hive, Twist, Gridly, Mini Sudoku, Geo and Zoom. Challenge friends and family, compare scores and join Circles." />
    <link rel="canonical" href="https://imbored.au/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="imBoredToday" />
    <meta property="og:title" content="imBoredToday | Daily Puzzles With Friends" />
    <meta property="og:description" content="Six quick daily brain games. Same challenge for everyone. Compare scores with friends and family." />
    <meta property="og:url" content="https://imbored.au/" />
    <meta property="og:image" content="https://imbored.au/assets/app-icon-source.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="apple-itunes-app" content="app-id=6804962205" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
