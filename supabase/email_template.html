<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Your I’mBoredToday sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#f1f3f7;font-family:Arial,sans-serif;color:#1b2129;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      Your I’mBoredToday sign-in code is {{ .Token }}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f3f7;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
            style="max-width:520px;background:#ffffff;border-radius:24px;">
            <tr>
              <td align="center" style="padding:36px 24px;">
                <div style="font-size:38px;line-height:1;margin-bottom:16px;">🎮</div>
                <h1 style="margin:0 0 10px;font-size:24px;line-height:1.3;color:#1b2129;">
                  Your sign-in code
                </h1>
                <p style="margin:0 0 22px;font-size:14px;line-height:1.6;color:#667085;">
                  Enter this six-digit code in I’mBoredToday:
                </p>
                <div style="display:inline-block;margin:0 0 22px;padding:16px 22px;border:1px solid #d9e2f5;border-radius:16px;background:#f7f9ff;color:#1b2129;font-family:Arial,sans-serif;font-size:34px;font-weight:700;letter-spacing:8px;line-height:1;white-space:nowrap;user-select:all;">
                  {{ .Token }}
                </div>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#667085;">
                  Tap and hold the code to copy it, then return to the app.
                </p>
                <p style="margin:22px 0 0;font-size:12px;line-height:1.5;color:#98a2b3;">
                  If you didn’t request this code, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
