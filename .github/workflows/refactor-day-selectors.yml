name: Refactor day selectors

on:
  push:
    branches: [main]
    paths:
      - "scripts/refactor-day-selectors.mjs"
      - ".github/workflows/refactor-day-selectors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply shared DaySelector
        run: node scripts/refactor-day-selectors.mjs

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/Hive.jsx src/games/Tango.jsx src/games/Zip.jsx src/games/MiniSudoku.jsx src/games/Geo.jsx src/games/Zoom.jsx
          git commit -m "Unify practice day selectors across games"
          git push origin main
