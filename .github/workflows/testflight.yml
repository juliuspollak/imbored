name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      tester_group:
        description: "External TestFlight group (leave blank to upload only)"
        required: false
        default: "Family Testers"
        type: string
      release_notes:
        description: "What to Test (optional)"
        required: false
        type: string
      build_number:
        description: "Build number override (blank = latest TestFlight build + 1)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, sign, and upload
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      APP_IDENTIFIER: au.imbored.app
      APP_VERSION: "1.0"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select and validate stable Xcode 26
        run: |
          set -euo pipefail
          selected_xcode=""
          selected_minor=-1
          selected_patch=-1
          for xcode_app in /Applications/Xcode_26*.app; do
            [[ -d "$xcode_app" ]] || continue
            case "$xcode_app" in
              *[Bb]eta*|*[Rr][Cc]*) continue ;;
            esac
            candidate_version=$("$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version | awk 'NR == 1 { print $2 }')
            candidate_major=${candidate_version%%.*}
            candidate_rest=${candidate_version#*.}
            candidate_minor=${candidate_rest%%.*}
            candidate_patch=0
            if [[ "$candidate_rest" == *.* ]]; then
              candidate_patch=${candidate_rest#*.}
              candidate_patch=${candidate_patch%%.*}
            fi
            if [[ "$candidate_major" =~ ^[0-9]+$ && "$candidate_minor" =~ ^[0-9]+$ && "$candidate_patch" =~ ^[0-9]+$ && "$candidate_major" -eq 26 ]] &&
              (( candidate_minor > selected_minor || (candidate_minor == selected_minor && candidate_patch > selected_patch) )); then
              selected_xcode="$xcode_app"
              selected_minor="$candidate_minor"
              selected_patch="$candidate_patch"
            fi
          done
          [[ -n "$selected_xcode" ]] || { echo "::error::No stable Xcode 26 installation was found on this runner."; exit 1; }
          sudo xcode-select --switch "$selected_xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$selected_xcode/Contents/Developer" >> "$GITHUB_ENV"

          xcodebuild -version
          xcode_version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          xcode_major=${xcode_version%%.*}
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          sdk_major=${sdk_version%%.*}
          echo "iPhoneOS SDK $sdk_version"
          [[ "$xcode_major" =~ ^[0-9]+$ && "$xcode_major" -ge 26 ]] || { echo "::error::Xcode 26 or later is required; found $xcode_version."; exit 1; }
          [[ "$sdk_major" =~ ^[0-9]+$ && "$sdk_major" -ge 26 ]] || { echo "::error::iPhoneOS SDK 26 or later is required; found $sdk_version."; exit 1; }

      - name: Validate required secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_STORE_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret $name is missing."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.7"
          bundler-cache: true

      - name: Put bundled CocoaPods on PATH
        run: |
          set -euo pipefail
          bundle binstubs cocoapods --path "$RUNNER_TEMP/bundle-bin"
          echo "$RUNNER_TEMP/bundle-bin" >> "$GITHUB_PATH"

      - name: Verify bundled Ruby toolchain
        run: |
          set -euo pipefail
          which ruby
          ruby --version
          which bundle
          bundle --version
          bundle exec fastlane --version
          bundle exec pod --version
          which pod
          pod --version
          [[ "$(which pod)" == "$RUNNER_TEMP/bundle-bin/pod" ]] || { echo "::error::pod does not resolve to the Bundler binstub."; exit 1; }

      - name: Run tests and production web build
        run: |
          npm test
          npm run build

      - name: Sync Capacitor iOS project
        run: npm run ios:sync

      - name: Resolve unique build number
        id: build_number
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: bundle exec fastlane ios resolve_build_number

      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/app-store.mobileprovision"
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$profile"
          keychain_password="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Import the complete PKCS#12. Supplying `-t cert` can restrict the
          # import to the certificate and leave its private key unavailable.
          security import "$certificate" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")
          profile_aps=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:aps-environment' "$profile_plist")
          [[ "$profile_team" == "$APPLE_TEAM_ID" ]] || { echo "::error::Provisioning profile belongs to team $profile_team, expected $APPLE_TEAM_ID"; exit 1; }
          [[ "$profile_app_id" == "$APPLE_TEAM_ID.$APP_IDENTIFIER" ]] || { echo "::error::Provisioning profile is for $profile_app_id, expected $APPLE_TEAM_ID.$APP_IDENTIFIER"; exit 1; }
          [[ "$profile_aps" == "production" ]] || { echo "::error::Provisioning profile does not contain the production APNs entitlement."; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          # Safe diagnostic: this prints only identity hashes and display names.
          # It never prints the certificate, private key, profile, or passwords.
          identities=$(security find-identity -v -p codesigning "$keychain")
          printf '%s\n' "$identities"
          identity_line=$(printf '%s\n' "$identities" | grep -m1 '"Apple Distribution:') || { echo "::error::No usable Apple Distribution identity with a private key was imported from the .p12."; exit 1; }
          identity_hash=$(printf '%s\n' "$identity_line" | awk '{ print $2 }')
          identity_name=$(printf '%s\n' "$identity_line" | sed -E 's/.*"([^"]+)".*/\1/')
          profile_certificate_hashes=$(ruby -r rexml/document -r digest -r base64 -e 'doc=REXML::Document.new(File.read(ARGV.fetch(0))); nodes=doc.get_elements("plist/dict").first.elements.to_a; index=nodes.index { |node| node.name=="key" && node.text=="DeveloperCertificates" }; abort("Profile has no DeveloperCertificates") unless index; nodes.fetch(index+1).get_elements("data").each { |node| puts Digest::SHA1.hexdigest(Base64.decode64(node.text.to_s)).upcase }' "$profile_plist")
          printf '%s\n' "$profile_certificate_hashes" | grep -Fxq "$identity_hash" || { echo "::error::The imported Apple Distribution certificate is not included in the provisioning profile. Regenerate the profile using this distribution certificate."; exit 1; }
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "identity_name=$identity_name" >> "$GITHUB_OUTPUT"

      - name: Configure signing for the App target only
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity_name }}
        run: bundle exec fastlane ios configure_ci_signing

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/imBored.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.build_number }}"

      - name: Export signed IPA
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          export_plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_plist"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_plist"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_IDENTIFIER string $PROFILE_UUID" "$export_plist"
          plutil -lint "$export_plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/imBored.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$export_plist"

      - name: Upload to TestFlight
        env:
          IPA_PATH: ${{ runner.temp }}/export/App.ipa
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTER_GROUP: ${{ inputs.tester_group }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: bundle exec fastlane ios upload

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app-store.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision"
