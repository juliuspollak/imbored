name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      tester_group:
        description: "External TestFlight group (leave blank to upload only)"
        required: false
        default: "Family Testers"
        type: string
      release_notes:
        description: "What to Test (optional)"
        required: false
        type: string
      build_number:
        description: "Build number override (blank = latest TestFlight build + 1)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, sign, and upload
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    env:
      APP_IDENTIFIER: au.imbored.app
      APP_VERSION: "1.0"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate required secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_STORE_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret $name is missing."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests and production web build
        run: |
          npm test
          npm run build

      - name: Sync Capacitor iOS project
        run: npm run ios:sync

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: bundle exec pod install --project-directory=ios/App

      - name: Resolve unique build number
        id: build_number
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: bundle exec fastlane ios resolve_build_number

      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/app-store.mobileprovision"
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$profile"
          keychain_password="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")
          profile_aps=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:aps-environment' "$profile_plist")
          [[ "$profile_app_id" == "$APPLE_TEAM_ID.$APP_IDENTIFIER" ]] || { echo "::error::Provisioning profile is for $profile_app_id, expected $APPLE_TEAM_ID.$APP_IDENTIFIER"; exit 1; }
          [[ "$profile_aps" == "production" ]] || { echo "::error::Provisioning profile does not contain the production APNs entitlement."; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Archive app
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/imBored.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_IDENTIFIER" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Export signed IPA
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          export_plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_plist"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_plist"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_IDENTIFIER string $PROFILE_UUID" "$export_plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/imBored.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$export_plist"

      - name: Upload to TestFlight
        env:
          IPA_PATH: ${{ runner.temp }}/export/App.ipa
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTER_GROUP: ${{ inputs.tester_group }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: bundle exec fastlane ios upload

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app-store.mobileprovision" "$RUNNER_TEMP/profile.plist"
