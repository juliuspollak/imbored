name: Apply Hive source migration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-hive-rebrand.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source migration
        run: node scripts/apply-hive-rebrand.mjs
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit proper Hive implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-hive-rebrand.mjs .github/workflows/apply-hive-rebrand.yml
          git add -A
          git commit -m "Implement Hive branding in source"
          git push
