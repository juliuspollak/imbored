name: One-off Home challenge loading fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Home.jsx')
          s = p.read_text()
          replacements = [
            (
              '  const missedYesterdayGames = personalGames.filter((game) => !personalYesterdayCompleted.has(game.id));',
              '  const missedYesterdayGames = challengesLoaded ? personalGames.filter((game) => !personalYesterdayCompleted.has(game.id)) : [];'
            ),
            (
              '{playMode === "challenge" && onChallengeScopeChange && (',
              '{playMode === "challenge" && onChallengeScopeChange && challengesLoaded && !gameConfigLoading && ('
            ),
            (
              '{missedYesterdayGames.length > 0 && <div style={{ padding:"var(--space-3) var(--space-4)", borderTop:"1px solid var(--color-border)", background:"var(--color-warning-bg)" }}>',
              '{challengesLoaded && missedYesterdayGames.length > 0 && <div style={{ padding:"var(--space-3) var(--space-4)", borderTop:"1px solid var(--color-border)", background:"var(--color-warning-bg)" }}>'
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'target not found: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('src/lib/personalChallengeCatchup.test.js')
          tests = t.read_text()
          marker = 'does not render missed-yesterday state before challenge data loads'
          if marker not in tests:
            tests += '''\n\ntest("does not render missed-yesterday state before challenge data loads", () => {\n  assert.match(home, /const missedYesterdayGames = challengesLoaded \\? personalGames\\.filter/);\n  assert.match(home, /onChallengeScopeChange && challengesLoaded && !gameConfigLoading/);\n  assert.match(home, /challengesLoaded && missedYesterdayGames\\.length > 0/);\n});\n\ntest("loaded personal challenge keeps its games visible without expanding results", () => {\n  const todayGames = home.indexOf("TODAY&apos;S GAMES");\n  const resultsToggle = home.indexOf("View your results and more");\n  assert.ok(todayGames >= 0);\n  assert.ok(resultsToggle > todayGames);\n  assert.match(home, /personalGames\\.map/);\n});\n'''
            t.write_text(tests)
          PY
      - name: Validate
        run: |
          npm ci
          npm test
          npm run build
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Home.jsx src/lib/personalChallengeCatchup.test.js
          git commit -m "Fix Home challenge loading state"
          git push origin HEAD:main
